{% extends "base.html" %}

{% block title %}Login - School ERP{% endblock %}

{% block head %}
<style>
    body {
        background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }
    #wrapper {
        display: block;
        width: 100%;
    }
    .navbar, #sidebar-wrapper {
        display: none !important;
    }
    .login-card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 1rem 3rem rgba(0,0,0,0.175);
        overflow: hidden;
    }
    .login-header {
        background-color: #fff;
        padding: 3rem 2rem 1.5rem;
        text-align: center;
    }
    .login-body {
        background-color: #fff;
        padding: 0 3rem 3rem;
    }
    .form-control-user {
        border-radius: 10rem;
        padding: 1.5rem 1.25rem;
        border: 1px solid #d1d3e2;
    }
    .btn-user {
        border-radius: 10rem;
        padding: 0.75rem 1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1rem;
    }
    .school-logo {
        color: #4e73df;
        font-size: 4rem;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6 col-md-9">
            <div class="card login-card mt-5">
                <div class="login-header">
                    <div class="school-logo">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h1 class="h3 text-gray-900 mb-2 fw-bold">{{ g.settings.get('school_name', 'School ERP') }}</h1>
                    <p class="text-muted small">Welcome back! Please enter your details.</p>
                </div>
                <div class="login-body">
                    <form method="POST">
                        <div class="mb-3">
                            <input type="text" name="username" class="form-control form-control-user" placeholder="Username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <input type="password" name="password" class="form-control form-control-user" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-user w-100 shadow-sm">
                            Sign In
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a class="small text-decoration-none text-muted" href="#">Forgot Password?</a>
                    </div>
                </div>
            </div>
            <div class="text-center mt-4 text-white-50">
                <small>&copy; 2025 Afedia Glory & Awani Caleb</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
