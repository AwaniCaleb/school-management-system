{% extends "base.html" %}
{% block title %}Edit Subject - School ERP{% endblock %}
{% block content %}
<div class="card shadow max-width-600 mx-auto">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Edit Subject: {{ sub.subject_name }}</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Subject Name</label>
                <input type="text" name="subject" class="form-control" value="{{ sub.subject_name }}" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Department</label>
                <select name="department_id" class="form-select">
                    <option value="">-- No Department --</option>
                    {% for d in departments %}
                    <option value="{{ d.id }}" {% if sub.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('classes.list_subjects') }}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
