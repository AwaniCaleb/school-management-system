{% extends "base.html" %}
{% block title %}Edit Subject - School ERP{% endblock %}
{% block content %}
<div class="card shadow max-width-600 mx-auto">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Edit Subject: {{ sub.subject_name }}</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-4">
                <label class="form-label">Subject Name</label>
                <input type="text" name="subject" class="form-control" value="{{ sub.subject_name }}" required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('classes.class_detail', class_id=sub.class_id) }}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
