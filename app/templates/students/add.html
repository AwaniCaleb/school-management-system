{% extends "base.html" %}
{% block title %}Enroll New Student - School ERP{% endblock %}
{% block content %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Student Enrollment Form</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <!-- Personal Info -->
                <div class="col-md-6">
                    <h5 class="mb-3 text-muted"><i class="fas fa-user me-2"></i> Personal Information</h5>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" name="dob" class="form-control">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Blood Group</label>
                            <input type="text" name="blood_group" class="form-control" placeholder="O+">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Religion</label>
                            <input type="text" name="religion" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">State of Origin</label>
                        <input type="text" name="state_of_origin" class="form-control">
                    </div>
                </div>

                <!-- Contact & Guardian -->
                <div class="col-md-6">
                    <h5 class="mb-3 text-muted"><i class="fas fa-home me-2"></i> Contact & Guardian</h5>
                    <div class="mb-3">
                        <label class="form-label">Guardian Name</label>
                        <input type="text" name="guardian_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Guardian Phone</label>
                        <input type="text" name="guardian_phone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student Contact No</label>
                        <input type="text" name="contact_no" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Residential Address</label>
                        <textarea name="address" class="form-control" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <hr>

            <div class="mb-4">
                <h5 class="mb-3 text-muted"><i class="fas fa-notes-medical me-2"></i> Medical Notes</h5>
                <textarea name="medical_notes" class="form-control" rows="3" placeholder="Allergies, disabilities, etc."></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Enroll Student</button>
                <a href="{{ url_for('students.directory') }}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
