{% extends "base.html" %}
{% block title %}Edit Student - School ERP{% endblock %}
{% block content %}
<div class="card shadow max-width-600 mx-auto">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Edit Student: {{ stu.name }}</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ stu.name }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ stu.roll_no }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male" {{ 'selected' if stu.gender == 'Male' }}>Male</option>
                        <option value="Female" {{ 'selected' if stu.gender == 'Female' }}>Female</option>
                        <option value="Other" {{ 'selected' if stu.gender == 'Other' }}>Other</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dob" class="form-control" value="{{ stu.dob }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Guardian Name</label>
                <input type="text" name="guardian_name" class="form-control" value="{{ stu.guardian_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input type="text" name="contact_no" class="form-control" value="{{ stu.contact_no }}">
            </div>
            <div class="mb-4">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2">{{ stu.address }}</textarea>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('classes.class_detail', class_id=stu.class_id) }}" class="btn btn-light">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
